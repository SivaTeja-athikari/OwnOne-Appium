[pytest]
testpaths = automation/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
    smoke: Quick sanity check of critical user flows
    regression: Time-bounded, high-risk user journey checks for CI
    ios_smoke: Cross-platform online flows that do not toggle network radios
    tenant_isolation: Cross-company data protection and unauthorized access tests
    matrix: Cross-environment and cross-tenant parameterized tests

    authentication: Signup, login, credentials, and persisted sessions
    offline: Real-device offline workflow test
    schema_form: Schema-driven form rendering and field behavior
